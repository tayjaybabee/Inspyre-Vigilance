[project]
name = "inspyre-vigilance"
version = "0.2.0"
description = "Real-time system intelligence and event correlation framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Taylor-Jayde Blackstone", email = "t.blackstone@inspyre.tech" },
]
dependencies = [
    "packaging",
    "psutil",
    "rich",
]

[project.scripts]
inspyre-vigilance = "inspyre_vigilance.cli.main:main"
[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
